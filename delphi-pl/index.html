<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delphi Articles Index</title>
  <meta name="description" content="A bilingual index of Delphi articles with English and Polish versions.">
  <style>
    :root {
      --page-top: #f4efe7;
      --page-bottom: #e8ded0;
      --surface: rgba(255, 250, 244, 0.78);
      --surface-strong: #fffaf4;
      --surface-soft: rgba(255, 255, 255, 0.54);
      --ink: #261f18;
      --muted: #675d53;
      --rule: rgba(85, 66, 44, 0.14);
      --accent: #b55e2d;
      --accent-strong: #8a4318;
      --accent-soft: #f4ddca;
      --teal: #1e6a72;
      --shadow: 0 24px 72px rgba(62, 42, 21, 0.14);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --display: "Avenir Next", "Segoe UI", sans-serif;
      --body: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --mono: "SFMono-Regular", Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      font-family: var(--body);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.48), transparent 30%),
        radial-gradient(circle at 82% 12%, rgba(30, 106, 114, 0.08), transparent 18%),
        radial-gradient(circle at 20% 78%, rgba(181, 94, 45, 0.11), transparent 22%),
        linear-gradient(180deg, var(--page-top) 0%, var(--page-bottom) 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 72px;
    }

    .shell {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--rule);
      border-radius: 34px;
      background: linear-gradient(180deg, rgba(255, 251, 246, 0.92), rgba(253, 247, 240, 0.88));
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .shell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.4), transparent 36%),
        radial-gradient(circle at top right, rgba(181, 94, 45, 0.1), transparent 22%);
    }

    .topbar {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 18px 22px;
      border-bottom: 1px solid var(--rule);
      background: rgba(255, 255, 255, 0.36);
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
    }

    .brand-mark {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--teal));
      box-shadow: 0 0 0 6px rgba(181, 94, 45, 0.08);
    }

    h1 {
      margin: 18px 0 14px;
      font-family: var(--display);
      font-size: clamp(2.8rem, 5vw, 5.2rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
      max-width: 12ch;
    }

    .lead {
      max-width: 58ch;
      margin: 0;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.72;
    }

    .switcher {
      display: inline-flex;
      padding: 6px;
      border: 1px solid rgba(38, 31, 24, 0.08);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.66);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .switcher button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 0.75rem 1.15rem;
      border-radius: 999px;
      font: 700 0.82rem/1 var(--display);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .switcher button:hover {
      transform: translateY(-1px);
    }

    .switcher button[aria-pressed="true"] {
      color: #fff7f1;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      box-shadow: 0 10px 24px rgba(181, 94, 45, 0.22);
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 1rem 56px 56px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: 0 0 18px;
    }

    .section-title {
      margin: 0;
      font-family: var(--display);
      font-size: 1.05rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .section-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .posts {
      display: grid;
      gap: 22px;
    }

    .post-card {
      padding: 24px;
      border: 1px solid rgba(85, 66, 44, 0.1);
      border-radius: var(--radius-xl);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(255, 252, 248, 0.88));
      box-shadow: 0 16px 32px rgba(70, 48, 23, 0.08);
      transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
    }

    .post-thumb-and-details {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
    }

    .post-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 24px 48px rgba(70, 48, 23, 0.12);
      border-color: rgba(181, 94, 45, 0.2);
    }

    .thumb {
      position: relative;
      min-height: 220px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background:
        linear-gradient(150deg, rgba(181, 94, 45, 0.18), rgba(30, 106, 114, 0.16)),
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.18) 12px, rgba(255, 255, 255, 0.06) 12px, rgba(255, 255, 255, 0.06) 24px),
        linear-gradient(180deg, #f5e2d5, #d9e8e5);
      border: 1px dashed rgba(38, 31, 24, 0.14);
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .thumb::before,
    .thumb::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.38);
      filter: blur(2px);
    }

    .thumb::before {
      width: 124px;
      height: 124px;
      top: -18px;
      right: -18px;
    }

    .thumb::after {
      width: 88px;
      height: 88px;
      bottom: 18px;
      left: 18px;
    }

    .thumb-badge {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 0.5rem;
      padding: 1.2rem;
      text-align: center;
    }

    .thumb-badge strong {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      margin: 0 auto;
      padding: 0.45rem 0.72rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      font: 700 0.76rem/1 var(--mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-strong);
    }

    .thumb-badge span {
      max-width: 16ch;
      font-family: var(--display);
      font-size: 1.4rem;
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .post-body {
      display: grid;
      align-content: start;
      gap: 16px;
    }

    .post-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1.85rem;
      color: var(--muted);
      font: 700 0.8rem/1 var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .post-meta span {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .post-meta span::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(181, 94, 45, 0.5);
    }

    .post-title {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
    }

    .post-intro {
      margin: 0;
      color: var(--muted);
      font-size: 1.04rem;
      line-height: 1.75;
      max-width: 62ch;
    }

    .post-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 6px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0.88rem 1.15rem;
      border-radius: 999px;
      border: 1px solid transparent;
      font: 700 0.92rem/1 var(--display);
      letter-spacing: 0.02em;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button-primary {
      color: #fff8f2;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      box-shadow: 0 14px 28px rgba(181, 94, 45, 0.2);
    }

    .button-secondary {
      color: var(--ink);
      border-color: rgba(38, 31, 24, 0.1);
      background: rgba(255, 255, 255, 0.55);
    }

    .empty-state {
      padding: 24px;
      border: 1px dashed rgba(38, 31, 24, 0.16);
      border-radius: var(--radius-lg);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.45);
      font-size: 1rem;
    }

    .footer {
      position: relative;
      z-index: 1;
      padding: 0 56px 36px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    @media (max-width: 920px) {
      .content,
      .footer {
        padding-left: 24px;
        padding-right: 24px;
      }

      .post-thumb-and-details {
        grid-template-columns: 1fr;
      }

      .thumb {
        min-height: 180px;
      }
    }

    @media (max-width: 640px) {
      .page {
        width: min(100vw, calc(100vw - 16px));
        padding-top: 8px;
        padding-bottom: 28px;
      }

      .topbar {
        padding: 14px 16px;
      }

      .content,
      .footer {
        padding-left: 16px;
        padding-right: 16px;
      }

      h1 {
        max-width: none;
      }

      .section-head {
        flex-direction: column;
        align-items: start;
      }

      .post-card {
        padding: 16px;
      }

      .switcher {
        width: 100%;
        justify-content: space-between;
      }

      .switcher button {
        flex: 1 1 0;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>Delphi Blog</span>
        </div>
        <div class="switcher" role="group" aria-label="Language switch">
          <button type="button" data-lang="en" aria-pressed="true">English</button>
          <button type="button" data-lang="pl" aria-pressed="false">Polski</button>
        </div>
      </header>

      <section class="content">
        <div class="section-head">
          <h2 class="section-title" id="section-title">Articles</h2>
        </div>

        <div class="posts" id="posts"></div>
      </section>

      <footer class="footer" id="footer-copy">
        Empty footer copy for now. Maybe some contact info or social media links will go here in the future.
      </footer>
    </div>
  </main>

  <script>
    // --------------------------------------------------
    const availablePosts = [
      {
        postId: 1,
        language: 'en',
        title: 'More Readable Code with Class Helpers',
        author: 'Bogdan Polak',
        intro: 'Delphi projects tend to accumulate a lot of procedural glue over time, usually in the form of utility functions. That code works, but reading it becomes increasingly expensive. The same patterns show up in different parts of the codebase. Class helpers available in all modern Delphi versions are one of the simplest ways to make that code easier to read.',
        date: '2026-03-13',
        href: './001-class-helpers-readable-code-en.html',
        coverImage: './images/001-cover-image.png'
      },
      {
        postId: 1,
        language: 'pl',
        title: 'Czytelny Kod Dzięki Class Helpers',
        author: 'Bogdan Polak',
        intro: 'Projekty Delphi z czasem gromadzą dużo proceduralnego kodu pomocniczego, zwykle w postaci funkcji narzędziowych. Ten kod działa, ale jego czytanie staje się coraz bardziej kosztowne. Te same wzorce pojawiają się w różnych częściach kodu. Class helpers dostępne we wszystkich nowoczesnych wersjach Delphi są jednym z najprostszych sposobów, aby uczynić ten kod łatwiejszym do czytania.',
        date: '2026-03-13',
        href: './001-class-helpers-readable-code-pl.html',
        coverImage: './images/001-cover-image.png'
      },
      {
        postId: 2,
        language: 'en',
        title: 'Safe Refactoring with the Introduce Parameter Object Pattern',
        author: 'Bogdan Polak',
        intro: 'Refactoring can feel risky, especially when you work with code where state is spread across many arguments and business logic is split between multiple modules. A practical way to reduce that risk is to group related arguments into a single context object and migrate call sites in small, verified steps. In this article, we will examine that idea using a Monopoly example and show how to apply the `Introduce Parameter Object` pattern in a legacy codebase.',
        date: '2026-03-23',
        href: './002-refactoring-parameter-object-en.html',
        coverImage: './images/002-cover-image.png'
      },
      {
        postId: 2,
        language: 'pl',
        title: 'Bezpieczna refaktoryzacja z Introduce Parameter Object',
        author: 'Bogdan Polak',
        intro: 'Refaktoryzacja może wydawać się ryzykowna, zwłaszcza gdy pracujesz z kodem, w którym stan jest rozproszony na wiele argumentów, a logika biznesowa zapisana w  wielu modułach. Praktycznym sposobem na zmniejszenie tego ryzyka jest grupowanie powiązanych argumentów w jeden obiekt kontekstu i migracja wywołań w małych, weryfikowanych krokach. W tym artykule przeanalizujemy tę ideę na przykładzie gry planszowej Monopoly i pokażemy, jak w praktyce zastosować wzorzec `Introduce Parameter Object` w zastanym kodzie.',
        date: '2026-03-23',
        href: './002-refactoring-parameter-object-pl.html',
        coverImage: './images/002-cover-image.png'
      },
    ];
    // --------------------------------------------------

    const postsRoot = document.getElementById('posts');
    const buttons = document.querySelectorAll('[data-lang]');

    let activeLanguage = 'en';

    const txtEngNoPostsMessage = 'No posts are available for this language yet.';

    function createMetaItem(label, value) {
      return `<span><strong>${label}:</strong>&nbsp;${value}</span>`;
    }

    function renderPosts(htmlLanguage) {
      const visiblePosts = availablePosts.filter((post) => post.language === htmlLanguage);

      document.documentElement.lang = htmlLanguage;

      buttons.forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.lang === htmlLanguage));
      });

      if (visiblePosts.length === 0) {
        postsRoot.innerHTML = `<div class="empty-state">${txtEngNoPostsMessage}</div>`;
        return;
      }

      postsRoot.innerHTML = visiblePosts.map(renderPostCard).join('');
    }

    function renderPostCard(post) {
      const labelCoverImageLSlot = 'Cover image slot';
      const labelDate = 'Date';
      const labelAuthor = 'Author';
      const labelLanguage = 'Language';
      const labelLanguageName = activeLanguage === 'en' ? 'English' : 'Polski';
      const labelImagePlaceholder = 'PNG Placeholder';
      const labelOpenArticle = 'Open article';

      return `
        <article class="post-card">
          <div class="post-body">
            <div class="post-meta">
              ${createMetaItem(labelDate, post.date)}
              ${createMetaItem(labelAuthor, post.author)}
              ${createMetaItem(labelLanguage, labelLanguageName)}
            </div>
            <h3 class="post-title">${post.title}</h3>

            <div class="post-thumb-and-details">
              <div class="thumb">
                <!--
                <div class="thumb-badge">
                  <strong>${labelImagePlaceholder}</strong>
                  <span>${labelCoverImageLSlot}</span>
                </div>
                -->
                <img src="${post.coverImage}" alt="${post.title} cover image" width="280" height="220" loading="lazy">
              </div>
              <div class="post-details">
                <p class="post-intro">${post.intro}</p>
                <div class="post-actions">
                  <a class="button button-primary" href="${post.href}">${labelOpenArticle}</a>
                </div>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    buttons.forEach((button) => {
      button.addEventListener('click', () => {
        const nextLanguage = button.dataset.lang;
        if (nextLanguage === activeLanguage) {
          return;
        }

        activeLanguage = nextLanguage;
        renderPosts(activeLanguage);
      });
    });

    renderPosts(activeLanguage);
  </script>
</body>

</html>
